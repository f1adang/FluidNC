[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
; Debug aid: a 64K coredump partition, carved out of the app1 OTA slot so that
; nvs, app0 and spiffs keep their offsets - an existing config.yaml and the
; WebUI files on SPIFFS survive the change.  ESP_COREDUMP_ENABLE_TO_FLASH is
; already set in the framework's sdkconfig; the only thing missing was somewhere
; to write to, which is why every panic logged "No core dump partition found".
; Remove this line to go back to the stock table.
board_build.partitions = min_littlefs_coredump.csv
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py
